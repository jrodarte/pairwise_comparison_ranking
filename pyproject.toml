[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thinktui"
version = "0.1.0"
description = "ThinkTUI: Structured Thinking & Decision Toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual>=1.0,<7", "platformdirs>=4.0", "keyring>=25"]

[project.scripts]
pairrank = "pairwise_prioritizer.__main__:main"
thinktui = "thinktui.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/pairwise_prioritizer", "src/thinktui"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
